name: Bug Report
description: Report a bug, connection failure, or UI glitch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: env
    attributes:
      label: Operating System / Distribution
      placeholder: e.g. Windows 11 24H2 or Fedora 45 KDE Plasma 6 (Wayland)
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Wireless Earbuds Model & Kalm Version
      placeholder: e.g. vivo TWS 5 Hi-Fi / HUAWEI FreeBuds 6i / realme Buds T300, kalm v0.5
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What Happened & Steps to Reproduce
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Output (`kalm status` / `kalm probe`)
      render: shell
